server:
  port: 8080
spring:
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    active: dev
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: "localhost"
    username: "postgres"
    password: "123456"
    database: "authentication"
    port: 5432
security:
  jwt:
    secret: "bXlTZWNyZXRLZXlGb3JKV1RUb2tlbjEyMzQ1Njc4OTA="
    expiration-seconds: 3600
    issuer: "authentication"
